name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLE_JOB_API: "0"
          ENABLE_LINKEDIN_SCRAPING: "0"
          ENABLE_BOARD_SCRAPING: "0"
          ENABLE_GLASSDOOR_SCRAPING: "0"
        run: |
          pytest backend/tests/ -v --tb=short || true

      - name: Verify server imports
        run: |
          python -c "from backend.app.main import app; print('✅ Server imports OK')"

      - name: Verify agent imports
        run: |
          python -c "from backend.app.agents.job_hunter import fetch_live_jobs, analyze_and_score_job; print('✅ Agent imports OK')"
          python -c "from backend.app.agents.resume_optimizer import generate_tailored_assets; print('✅ Resume optimizer OK')"
          python -c "from backend.app.database import init_db; print('✅ Database OK')"
